services:
  kafka:
    image: apache/kafka:4.3.1
    container_name: cloudscale-kafka
    restart: unless-stopped

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://cloudscale-kafka:29092,EXTERNAL://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@cloudscale-kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

    volumes:
      - kafka_data:/var/lib/kafka/data

    networks:
      - cloudscale-network


  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: cloudscale-kafka-ui
    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      KAFKA_CLUSTERS_0_NAME: cloudscale-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: cloudscale-kafka:29092

    depends_on:
      - kafka

    networks:
      - cloudscale-network


  postgres:
    image: postgres:16
    container_name: cloudscale-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: cloudscale
      POSTGRES_USER: cloudscale
      POSTGRES_PASSWORD: cloudscale_pass

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - cloudscale-network


  spark:
    image: apache/spark:4.2.0-python3
    container_name: cloudscale-spark
    restart: unless-stopped

    working_dir: /workspace

    volumes:
      - .:/workspace

    entrypoint: ["/bin/bash", "-c"]
    command: ["tail -f /dev/null"]

    networks:
      - cloudscale-network


volumes:
  kafka_data:
  postgres_data:


networks:
  cloudscale-network:
    external: true