services:

  prometheus:
    image: prom/prometheus:latest
    container_name: cloudscale-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - cloudscale-network

  grafana:
    image: grafana/grafana:latest
    container_name: cloudscale-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - cloudscale-network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.2
    container_name: cloudscale-cadvisor
    restart: unless-stopped
    ports:
      - "8083:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    networks:
      - cloudscale-network

volumes:
  grafana_data:

networks:
  cloudscale-network:
    external: true